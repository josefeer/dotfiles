# Config version for compatibility and deprecations.
# Version 2 requires persistent workspaces to be declared explicitly.
config-version = 2

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
# AeroSpace has no per-workspace layout setting, so set the root layout of these
# persistent workspaces once at startup (DevTools, Comms, Finder).
after-startup-command = [
  'layout --workspace "DevTools(7)" --root accordion',
  'layout --workspace "Comms(8)" --root accordion',
  'layout --workspace "Finder(1)" --root accordion',
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 200

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# AeroSpace forbids spaces in workspace names, so keep shortcut hints adjacent.
# Keep workspaces available even when they have no windows.
persistent-workspaces = ['Finder(1)', 'Planning(2)', 'Notes(3)', 'Web(4)', '5', '6', 'DevTools(7)', 'Comms(8)', 'Music(9)', '0', 'Terminal']

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 15
inner.vertical =   15
outer.left =       15
outer.bottom =     15
outer.top =        15
outer.right =      15

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# Dedicated terminal (Terminal) workspace.
alt-enter = 'workspace Terminal'
alt-shift-enter = 'move-node-to-workspace Terminal'

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-minus = 'resize smart -100'
alt-equal = 'resize smart +100'

# See: https://nikitabobko.github.io/AeroSpace/commands#balance-sizes
# Reset all windows in the workspace to equal sizes after manual resizing.
alt-shift-minus = 'balance-sizes'

# See: https://nikitabobko.github.io/AeroSpace/commands#fullscreen
# AeroSpace fullscreen (not macOS native): the window fills the workspace and stays
# managed by AeroSpace, without creating a separate macOS Space. Press again to exit.
alt-f = 'fullscreen'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-1 = 'workspace "Finder(1)"'
alt-2 = 'workspace "Planning(2)"'
alt-3 = 'workspace "Notes(3)"'
alt-4 = 'workspace "Web(4)"'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace "DevTools(7)"'
alt-8 = 'workspace "Comms(8)"'
alt-9 = 'workspace "Music(9)"'
alt-0 = 'workspace 0'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
alt-shift-1 = 'move-node-to-workspace "Finder(1)"'
alt-shift-2 = 'move-node-to-workspace "Planning(2)"'
alt-shift-3 = 'move-node-to-workspace "Notes(3)"'
alt-shift-4 = 'move-node-to-workspace "Web(4)"'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace "DevTools(7)"'
alt-shift-8 = 'move-node-to-workspace "Comms(8)"'
alt-shift-9 = 'move-node-to-workspace "Music(9)"'
alt-shift-0 = 'move-node-to-workspace 0'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-tab = 'workspace-back-and-forth'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
# Disabled: only useful with 2+ monitors (e.g. external + laptop screen), where it
# sends the current workspace to the next monitor. It is a no-op on our current
# single-monitor setup. Re-enable together with 'workspace-to-monitor-force-assignment'
# if a second monitor is added.
# alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = 'mode service'


# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#layout
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
t = ['layout tiles horizontal vertical', 'mode main']
a = ['layout accordion horizontal vertical', 'mode main']

backspace = ['close-all-windows-but-current', 'mode main']

# See: https://nikitabobko.github.io/AeroSpace/commands#join-with
# 'join-with' wraps the focused window and its neighbour in the given direction into a
# new nested container, enabling layouts beyond a single flat row, e.g. one big window
# on the left and two stacked on the right (focus the top-right window, join-with down).
# The new container takes the opposite orientation of its parent, and you can then switch
# it to accordion (alt-comma) to stack windows within one tile. Not enabled for now;
# uncomment to use from service mode (alt-shift-semicolon, then alt-shift-<hjkl>).
# alt-shift-h = ['join-with left', 'mode main']
# alt-shift-j = ['join-with down', 'mode main']
# alt-shift-k = ['join-with up', 'mode main']
# alt-shift-l = ['join-with right', 'mode main']

# Floating windows
# Utilities, settings panels and popups that look wrong when tiled. Callbacks are
# matched top to bottom and the first match wins, so these must stay above the
# workspace assignment rules below.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.amazonaws.acvc.osx' # AWS VPN Client
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.microsoft.CompanyPortalMac'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.openlogi.openlogi'
run = 'layout floating'

# Finder "Get Info" panels are titled "<name> Info"; float them, tile normal windows.
[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = ' Info$'
run = ['layout floating', 'move-node-to-workspace "Finder(1)"']

# Managed Windows
# Finder
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'move-node-to-workspace "Finder(1)"'

# Planning
[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = 'move-node-to-workspace "Planning(2)"'

[[on-window-detected]]
if.app-id = 'com.todoist.mac.Todoist'
run = 'move-node-to-workspace "Planning(2)"'

# Notes
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace "Notes(3)"'

# Main Browser
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace "Web(4)"'

# Terminal
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace Terminal'

# DevTools (includes secondary browsers, used for development/testing)
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace "DevTools(7)"'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace "DevTools(7)"'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace "DevTools(7)"'

[[on-window-detected]]
if.app-id = 'com.dbpro.app'
run = 'move-node-to-workspace "DevTools(7)"'

[[on-window-detected]]
if.app-id = 'org.jkiss.dbeaver.core.product'
run = 'move-node-to-workspace "DevTools(7)"'

# Comms
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace "Comms(8)"'

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = 'move-node-to-workspace "Comms(8)"'

# Zoom: tile the main app and meeting windows; float its popups (settings, chat,
# participants, share picker...) on the same workspace.
# AeroSpace's heuristics classify the meeting window as a dialog and float it, so
# force tiling explicitly. Titles vary ("Zoom Meeting", "Zoom Meeting 40-Minutes"...).
[[on-window-detected]]
if.app-id = 'us.zoom.xos'
if.window-title-regex-substring = '^(Zoom|Zoom Workplace)$|^Zoom Meeting'
run = ['layout tiling', 'move-node-to-workspace "Comms(8)"']

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = ['layout floating', 'move-node-to-workspace "Comms(8)"']


# Music
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace "Music(9)"'
